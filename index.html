function applyLanguage(lang){currentLang=I18N[lang]?lang:"de";localStorage.setItem(KEYS.lang,currentLang);const x=t();document.documentElement.lang=x.htmlLang;document.title="Hamburg Park";const pairs={brandSub:"brandSub",title:"title",subtitle:"subtitle",locateText:"locate",privacyText:"privacy",officialBadge:"officialBadge",permitTitle:"permitTitle",permitCopy:"permitCopy",permitSave:"permitSave",gpsTitle:"gpsTitle",gpsSub:"gpsSub",dataTitle:"dataTitle",dataSub:"dataSub",sourceLabel:"sourceLabel",disclaimer:"source",mapTitle:"mapTitle",mapSub:"mapSub",mapLegend:"mapLegend",mapLoading:"mapLoading"};Object.entries(pairs).forEach(([id,key])=>$(id).textContent=x[key]);$("currentFlag").innerHTML=FLAGS[currentLang];document.querySelectorAll(".lang-option").forEach(o=>{o.classList.toggle("active",o.dataset.lang===currentLang);o.innerHTML=FLAGS[o.dataset.lang]});renderPermitSaved();if(lastResult)renderResult(lastResult,false)}
function closeLang(){$("langWrap").classList.remove("open")}$("langTrigger").onclick=e=>{e.stopPropagation();$("langWrap").classList.toggle("open")};document.querySelectorAll(".lang-option").forEach(o=>o.onclick=()=>{applyLanguage(o.dataset.lang);closeLang()});document.onclick=()=>closeLang();
function normalizePermit(v){return String(v||"").trim().toUpperCase()}function validPermit(v){return /^[A-ZÄÖÜ]{1,3}\d{2,4}$/i.test(v)}function renderPermitSaved(){const p=localStorage.getItem(KEYS.permit),x=t();$("permitSaved").textContent=p?`${x.permitSaved}: ${p}`:x.permitNone;$("permitInput").value=p||""}$("permitSave").onclick=()=>{const p=normalizePermit($("permitInput").value);if(!validPermit(p)){setStatus(t().permitInvalid,"warn");return}localStorage.setItem(KEYS.permit,p);renderPermitSaved();if(lastResult)renderResult(lastResult,false)};
function setStatus(text,cls=""){const el=$("status");el.className="status "+cls;el.style.display="block";el.innerHTML=text}
function pointInRing(point,ring){const[x,y]=point;let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||Number.EPSILON)+xi))inside=!inside}return inside}function pointInPolygon(p,c){if(!c?.length||!pointInRing(p,c[0]))return false;for(let i=1;i<c.length;i++)if(pointInRing(p,c[i]))return false;return true}function contains(f,p){const g=f.geometry;if(!g)return false;return g.type==="Polygon"?pointInPolygon(p,g.coordinates):g.type==="MultiPolygon"&&g.coordinates.some(x=>pointInPolygon(p,x))}
function distanceMeters(a,b){const R=6371000,lat=((a[1]+b[1])/2)*Math.PI/180,x=(b[0]-a[0])*Math.PI/180*Math.cos(lat),y=(b[1]-a[1])*Math.PI/180;return Math.hypot(x,y)*R}function pointSegMeters(p,a,b){const lat=p[1]*Math.PI/180,kx=111320*Math.cos(lat),ky=110540;const px=p[0]*kx,py=p[1]*ky,ax=a[0]*kx,ay=a[1]*ky,bx=b[0]*kx,by=b[1]*ky;const dx=bx-ax,dy=by-ay;const den=dx*dx+dy*dy;if(!den)return Math.hypot(px-ax,py-ay);let u=((px-ax)*dx+(py-ay)*dy)/den;u=Math.max(0,Math.min(1,u));return Math.hypot(px-(ax+u*dx),py-(ay+u*dy))}function geometryBoundaryDistance(f,p){const g=f.geometry;if(!g)return Infinity;const polys=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];let min=Infinity;for(const poly of polys)for(const ring of poly)for(let i=1;i<ring.length;i++)min=Math.min(min,pointSegMeters(p,ring[i-1],ring[i]));return min}
function isZoneCode(v){return /^[A-ZÄÖÜ]{1,3}\d{2,4}$/i.test(String(v||"").trim())}function isSelectedFeature(f,matches){const code=f?.properties?.bwp_code;return code&&matches.some(m=>m?.properties?.bwp_code===code)}
function zoneCard(f,lat,lon){const p=f.properties||{},x=t();return `<div class="zone-card"><div class="zone-label">${x.yourZone}</div><div class="zone">${esc(p.bwp_code)}</div><div class="zone-name">${esc(p.bwp_name)}</div></div><div class="details"><div class="row"><div class="label">${x.parkingRule}</div><div class="value">${esc(p.bewirtschaftungsart)}</div></div><div class="row"><div class="label">${x.hours}</div><div class="value">${esc(p.bewirtschaftungszeit)}</div></div><div class="row"><div class="label">${x.maxDuration}</div><div class="value">${p.hoechstparkdauer?esc(p.hoechstparkdauer)+" "+x.minutes:"—"}</div></div><div class="row"><div class="label">${x.feeZone}</div><div class="value">${esc(p.gebuehrenzone)}</div></div><div class="row"><div class="label">GPS</div><div class="value">${lat.toFixed(6)}, ${lon.toFixed(6)}</div></div></div>`}
function verdictHtml(d){const x=t(),permit=localStorage.getItem(KEYS.permit),codes=d.matches.map(f=>normalizePermit(f.properties?.bwp_code)).filter(Boolean);if(!permit)return `<div class="verdict"><strong>${x.permitUnknown}</strong><span>${x.permitCaveat}</span></div>`;const ok=codes.includes(permit);return `<div class="verdict ${ok?"ok":"error"}"><strong>${ok?x.permitMatch:x.permitMismatch}</strong><span>${x.permitCaveat}</span></div>`}
function boundaryHtml(d){if(!d.matches.length||lastAccuracy==null)return"";const dist=Math.min(...d.matches.map(f=>geometryBoundaryDistance(f,[d.lon,d.lat])));const threshold=Math.max(25,lastAccuracy*1.5);return dist<=threshold?`<div class="boundary-warning"><strong>${t().boundaryTitle}</strong><br>${t().boundaryText(Math.round(dist),Math.round(lastAccuracy))}</div>`:""}
function showSheet(f){const p=f.properties||{},x=t();$("sheetCode").textContent=isZoneCode(p.bwp_code)?p.bwp_code:x.zoneDetails;$("sheetName").textContent=p.bwp_name||"";$("sheetBody").innerHTML=`<div class="row"><div class="label">${x.parkingRule}</div><div class="value">${esc(p.bewirtschaftungsart)}</div></div><div class="row"><div class="label">${x.hours}</div><div class="value">${esc(p.bewirtschaftungszeit)}</div></div><div class="row"><div class="label">${x.maxDuration}</div><div class="value">${p.hoechstparkdauer?esc(p.hoechstparkdauer)+" "+x.minutes:"—"}</div></div><div class="row"><div class="label">${x.feeZone}</div><div class="value">${esc(p.gebuehrenzone)}</div></div>`;$("sheet").classList.add("open");$("sheetBackdrop").classList.add("open")}function closeSheet(){$("sheet").classList.remove("open");$("sheetBackdrop").classList.remove("open")}$("sheetClose").onclick=closeSheet;$("sheetBackdrop").onclick=closeSheet;
function initMap(){if(map||typeof L==="undefined")return;map=L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([53.5511,9.9937],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map)}
function drawZones(matches=[],lat=null,lon=null,focus=false){initMap();if(!map)return;const center=map.getCenter(),zoom=map.getZoom();if(zonesLayer)map.removeLayer(zonesLayer);if(userMarker){map.removeLayer(userMarker);userMarker=null}zonesLayer=L.geoJSON(allFeatures,{style:f=>{const active=isSelectedFeature(f,matches);return{color:active?"#312e81":"#64748b",weight:active?4:1.4,fillColor:active?"#6366f1":"#94a3b8",fillOpacity:active?.28:.07}},onEachFeature:(f,layer)=>{const p=f.properties||{},active=isSelectedFeature(f,matches),code=String(p.bwp_code||"").trim();if(isZoneCode(code))layer.bindTooltip(`<span class="zone-code-label${active?" active":""}">${esc(code)}</span>`,{permanent:true,direction:"center",className:"zone-tip",interactive:false});layer.on("click",()=>showSheet(f))}}).addTo(map);if(lat!=null&&lon!=null){userMarker=L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,fillColor:"#ef4444",fillOpacity:1}).addTo(map).bindTooltip("GPS",{direction:"top"});$("recenter").classList.add("show");if(focus)map.flyTo([lat,lon],16,{duration:.6});else map.setView(center,zoom,{animate:false})}else map.setView(center,zoom,{animate:false});setTimeout(()=>map.invalidateSize(),60)}
$("recenter").onclick=()=>{if(lastResult)map.flyTo([lastResult.lat,lastResult.lon],16,{duration:.5})};
async function loadZones(){$("mapLoading").classList.remove("hidden");initMap();try{const r=await fetch(API,{headers:{Accept:"application/geo+json,application/json"}});if(!r.ok)throw Error("API "+r.status);const d=await r.json();allFeatures=d.features||[];drawZones()}catch(e){setStatus(t().apiError,"error")}finally{$("mapLoading").classList.add("hidden")}}
function renderResult(d,focus=true){const x=t();if(!d.matches.length){setStatus(x.outside,"warn");$("result").innerHTML="";$("verdict").innerHTML=verdictHtml(d)}else{setStatus(d.matches.length>1?x.multiple(d.matches.length):x.found,"ok");$("result").innerHTML=d.matches.map(f=>zoneCard(f,d.lat,d.lon)).join("")+boundaryHtml(d);$("verdict").innerHTML=verdictHtml(d)}drawZones(d.matches,d.lat,d.lon,focus)}
async function locate(isAuto=false){$("result").innerHTML="";$("verdict").innerHTML="";$("locate").disabled=true;const x=t();if(!isAuto)setStatus(x.locating);if(!navigator.geolocation){setStatus(x.unsupported,"error");$("locate").disabled=false;return}navigator.geolocation.getCurrentPosition(async p=>{localStorage.setItem(KEYS.location,"1");const lat=p.coords.latitude,lon=p.coords.longitude;lastAccuracy=p.coords.accuracy;setStatus(`${x.checking}<br><span class="small">${x.accuracy}: ±${Math.round(lastAccuracy)} ${x.meters}</span>`);try{if(!allFeatures.length)await loadZones();const matches=allFeatures.filter(f=>contains(f,[lon,lat]));lastResult={matches,lat,lon};renderResult(lastResult,true)}catch(e){setStatus(x.apiError,"error")}finally{$("locate").disabled=false}},e=>{if(e.code===1)localStorage.removeItem(KEYS.location);setStatus(({1:x.denied,2:x.unavailable,3:x.timeout})[e.code]||x.unavailable,"error");$("locate").disabled=false},{enableHighAccuracy:true,timeout:15000,maximumAge:isAuto?30000:10000})}
$("locate").onclick=()=>locate(false);applyLanguage(currentLang);renderPermitSaved();loadZones().then(()=>{if(localStorage.getItem(KEYS.location)==="1")locate(true)});if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
