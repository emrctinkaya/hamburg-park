function status(s,c=''){$('status').style.display='block';$('status').className='status '+c;$('status').textContent=s}function inside(p,r){let x=p[0],y=p[1],z=false;for(let i=0,j=r.length-1;i<r.length;j=i++)if(((r[i][1]>y)!=(r[j][1]>y))&&(x<(r[j][0]-r[i][0])*(y-r[i][1])/((r[j][1]-r[i][1])||1e-12)+r[i][0]))z=!z;return z}function contains(f,p){let g=f.geometry,ps=g?.type==='Polygon'?[g.coordinates]:g?.type==='MultiPolygon'?g.coordinates:[];return ps.some(poly=>inside(p,poly[0])&&!poly.slice(1).some(r=>inside(p,r)))}
