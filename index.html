function isSelectedFeature(feature,matches){const code=feature?.properties?.bwp_code;return code&&matches.some(m=>m?.properties?.bwp_code===code)}
function drawZones(matches=[],lat=null,lon=null,focus=false){initMap();if(!map)return;const center=map.getCenter(),zoom=map.getZoom();if(zonesLayer)map.removeLayer(zonesLayer);if(userMarker){map.removeLayer(userMarker);userMarker=null}zonesLayer=L.geoJSON(allFeatures,{style:f=>{const active=isSelectedFeature(f,matches);return{color:active?"#312e81":"#64748b",weight:active?4:1.5,fillColor:active?"#6366f1":"#94a3b8",fillOpacity:active?.28:.08}},onEachFeature:(f,layer)=>{const p=f.properties||{},active=isSelectedFeature(f,matches),code=String(p.bwp_code||"").trim();if(isZoneCode(code))layer.bindTooltip(`<span class="zone-code-label${active?" active":""}">${esc(code)}</span>`,{permanent:true,direction:"center",className:"zone-tip",interactive:false});const popupParts=[];if(code)popupParts.push(`<strong>${esc(code)}</strong>`);if(p.bwp_name)popupParts.push(esc(p.bwp_name));if(p.bewirtschaftungsart)popupParts.push(`<small>${esc(p.bewirtschaftungsart)}</small>`);if(popupParts.length)layer.bindPopup(popupParts.join("<br>"),{autoPan:false});layer.on("click",()=>{const keepCenter=map.getCenter(),keepZoom=map.getZoom();setTimeout(()=>map.setView(keepCenter,keepZoom,{animate:false}),0)})}}).addTo(map);if(lat!=null&&lon!=null){userMarker=L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,fillColor:"#ef4444",fillOpacity:1}).addTo(map).bindTooltip("GPS",{direction:"top"});if(focus)map.flyTo([lat,lon],16,{duration:.65});else map.setView(center,zoom,{animate:false})}else map.setView(center,zoom,{animate:false});setTimeout(()=>map.invalidateSize(),60)}
async function loadZones(){initMap();try{const r=await fetch(API,{headers:{Accept:"application/geo+json,application/json"}});if(!r.ok)throw Error("API "+r.status);const d=await r.json();allFeatures=d.features||[];drawZones()}catch(e){setStatus(t().apiError,"error")}}
function renderResult(d,focus=true){const x=t();if(!d.matches.length){setStatus(x.outside,"warn");resultEl.innerHTML=""}else{setStatus(d.matches.length>1?x.multiple(d.matches.length):x.found,"ok");resultEl.innerHTML=d.matches.map(f=>zoneCard(f,d.lat,d.lon)).join("")}drawZones(d.matches,d.lat,d.lon,focus)}
async function locate(isAuto=false){resultEl.innerHTML="";btn.disabled=true;const x=t();if(!isAuto)setStatus(x.locating);if(!navigator.geolocation){setStatus(x.unsupported,"error");btn.disabled=false;return}navigator.geolocation.getCurrentPosition(async p=>{localStorage.setItem(LOCATION_KEY,"1");const lat=p.coords.latitude,lon=p.coords.longitude;setStatus(`${x.checking}<br><span class="small">${x.accuracy} ${Math.round(p.coords.accuracy)} ${x.meters}</span>`);try{if(!allFeatures.length){const r=await fetch(API,{headers:{Accept:"application/geo+json,application/json"}});if(!r.ok)throw Error("API "+r.status);const d=await r.json();allFeatures=d.features||[]}const matches=allFeatures.filter(f=>contains(f,[lon,lat]));lastResult={matches,lat,lon};renderResult(lastResult,true)}catch(e){setStatus(x.apiError,"error")}finally{btn.disabled=false}},e=>{if(e.code===1)localStorage.removeItem(LOCATION_KEY);setStatus(({1:x.denied,2:x.unavailable,3:x.timeout})[e.code]||x.genericLocationError,"error");btn.disabled=false},{enableHighAccuracy:true,timeout:15000,maximumAge:isAuto?30000:10000})}
btn.onclick=()=>locate(false);applyLanguage(currentLang);loadZones().then(()=>{if(localStorage.getItem(LOCATION_KEY)==="1")locate(true)});
</script>
</body></html>
