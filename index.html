function updateDataMeta(){if(!lastUpdated){$('dataMeta').textContent='';return}$('dataMeta').textContent=`Hamburg Open Data · ${lastUpdated.toLocaleString()}`}
async function load(){init();$('loading').classList.remove('hidden');try{let r=await fetch(API),d=await r.json();features=d.features||[];lastUpdated=new Date();draw();updateDataMeta()}catch(e){status(t().error,'error')}finally{$('loading').classList.add('hidden')}}
function handlePosition(p,focus=false){localStorage.setItem(K.loc,'1');const d={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy,matches:features.filter(f=>contains(f,[p.coords.longitude,p.coords.latitude]))};const changed=!last||Math.hypot((d.lat-last.lat)*111000,(d.lon-last.lon)*70000)>8||d.matches.map(f=>code(f.properties?.bwp_code)).join('|')!==last.matches.map(f=>code(f.properties?.bwp_code)).join('|');last=d;if(changed||focus)render(last,focus);$('locate').classList.add('hidden');$('live').classList.add('show')}
function stopWatch(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}$('live').classList.remove('show')}function startWatch(){if(watchId!=null||!navigator.geolocation||document.hidden)return;watchId=navigator.geolocation.watchPosition(p=>handlePosition(p,!last),e=>{if(e.code===1){localStorage.removeItem(K.loc);stopWatch();$('locate').classList.remove('hidden');status(t().denied,'error')}},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
$('locate').onclick=()=>{clearStatus();startWatch()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stopWatch();else if(localStorage.getItem(K.loc)==='1')startWatch()});addEventListener('online',()=>load());addEventListener('offline',()=>status(t().error,'warn'));applyLang(lang);renderSaved();load().then(()=>{if(localStorage.getItem(K.loc)==='1')startWatch()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
