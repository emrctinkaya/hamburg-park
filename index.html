<style>

<script>

const I18N={de:{htmlLang:"de",pageTitle:"Hamburg Parkzone",title:"Welche Parkzone ist hier?",subtitle:"Finde dein Hamburger Bewohnerparkgebiet direkt über deinen aktuellen GPS-Standort.",locate:"Standort prüfen",officialBadge:"Offizielle Hamburg-Daten",sourceLabel:"LBV / Hamburg Open Data",source:"Die App zeigt das Bewohnerparkgebiet. Verkehrszeichen vor Ort, Parkverbote, Zeiten, Zusatzschilder und vorübergehende Regelungen sind maßgeblich.",gpsTitle:"GPS-Standort",gpsSub:"Direkt vom Gerät",dataTitle:"Offizielle Daten",dataSub:"Hamburg Open Data",yourZone:"Dein Bewohnerparkgebiet",parkingRule:"Parkregelung",hours:"Zeiten",maxDuration:"Höchstparkdauer",feeZone:"Gebührenzone",minutes:"Min.",locating:"GPS-Standort wird ermittelt…",unsupported:"Dieser Browser unterstützt keine Standortbestimmung.",checking:"Standort gefunden. Parkgebiet wird geprüft…",accuracy:"GPS-Genauigkeit ca.",meters:"m",outside:"Dieser Standort liegt offenbar in keinem registrierten Bewohnerparkgebiet.",found:"Parkgebiet gefunden.",multiple:n=>`Der Standort liegt in ${n} Gebieten. Möglicherweise handelt es sich um einen Überlappungsbereich.`,apiError:"Die offiziellen Hamburger Parkdaten konnten nicht geladen werden.",denied:"Standortzugriff wurde nicht erlaubt. Aktiviere für diese Website in Safari unter Website-Einstellungen → Standort die Option „Erlauben“ oder „Fragen“.",unavailable:"Der GPS-Standort konnte nicht ermittelt werden.",timeout:"Die Standortabfrage hat zu lange gedauert. Prüfe die Standortfreigabe und versuche es erneut.",genericLocationError:"Standort konnte nicht ermittelt werden."},en:{htmlLang:"en",pageTitle:"Hamburg Parking Zone",title:"Which parking zone am I in?",subtitle:"Find your Hamburg resident parking zone instantly using your current GPS location.",locate:"Check my location",officialBadge:"Official Hamburg data",sourceLabel:"LBV / Hamburg Open Data",source:"The app shows the resident parking zone. Local traffic signs, parking restrictions, times, additional signs and temporary rules always take precedence.",gpsTitle:"GPS location",gpsSub:"Directly from your device",dataTitle:"Official data",dataSub:"Hamburg Open Data",yourZone:"Your resident parking zone",parkingRule:"Parking rule",hours:"Hours",maxDuration:"Maximum duration",feeZone:"Fee zone",minutes:"min",locating:"Getting GPS location…",unsupported:"This browser does not support geolocation.",checking:"Location found. Checking parking zone…",accuracy:"GPS accuracy approx.",meters:"m",outside:"This location does not appear to be inside a registered resident parking zone.",found:"Parking zone found.",multiple:n=>`The location matches ${n} zones. This may be an overlap area.`,apiError:"Could not access Hamburg's official parking data.",denied:"Location access was not allowed. In Safari, open Website Settings → Location and choose “Allow” or “Ask” for this website.",unavailable:"GPS location could not be determined.",timeout:"The location request timed out. Check location permission and try again.",genericLocationError:"Location could not be determined."},tr:{htmlLang:"tr",pageTitle:"Hamburg Park Bölgesi",title:"Hangi park bölgesindeyim?",subtitle:"Mevcut GPS konumunu kullanarak Hamburg’daki Bewohnerparkgebiet kodunu anında bul.",locate:"Konumumu kontrol et",officialBadge:"Resmi Hamburg verisi",sourceLabel:"LBV / Hamburg Open Data",source:"Uygulama Bewohnerparkgebiet bölgesini gösterir. Park yasağı, saat, alt levha ve geçici düzenlemelerde sokaktaki trafik işaretleri esas alınır.",gpsTitle:"GPS konumu",gpsSub:"Doğrudan cihazından",dataTitle:"Resmi veri",dataSub:"Hamburg Open Data",yourZone:"Bulunduğun park bölgesi",parkingRule:"Park düzeni",hours:"Saatler",maxDuration:"Azami süre",feeZone:"Ücret bölgesi",minutes:"dk",locating:"GPS konumu alınıyor…",unsupported:"Bu tarayıcı GPS konumunu desteklemiyor.",checking:"Konum bulundu. Park bölgesi kontrol ediliyor…",accuracy:"GPS doğruluğu yaklaşık",meters:"m",outside:"Bu konum kayıtlı bir Bewohnerparkgebiet içinde görünmüyor.",found:"Par let currentLang=localStorage.getItem(STORAGE_KEY)||"de";if(!I18N[currentLang])currentLang="de";
const btn=document.getElementById("locate"),locateText=document.getElementById("locateText"),statusEl=document.getElementById("status"),resultEl=document.getElementById("result"),titleEl=document.getElementById("title"),subtitleEl=document.getElementById("subtitle"),disclaimerEl=document.getElementById("disclaimer"),sourceLabelEl=document.getElementById("sourceLabel"),officialBadgeEl=document.getElementById("officialBadge"),langWrap=document.getElementById("langWrap"),langTrigger=document.getElementById("langTrigger"),currentFlag=document.getElementById("currentFlag"),gpsTitle=document.getElementById("gpsTitle"),gpsSub=document.getElementById("gpsSub"),dataTitle=document.getElementById("dataTitle"),dataSub=document.getElementById("dataSub");
function t(){return I18N[currentLang]}function applyLanguage(lang){currentLang=I18N[lang]?lang:"de";localStorage.setItem(STORAGE_KEY,currentLang);const x=t();document.documentElement.lang=x.htmlLang;document.title=x.pageTitle;titleEl.textContent=x.title;subtitleEl.textContent=x.subtitle;locateText.textContent=x.locate;disclaimerEl.textContent=x.source;sourceLabelEl.textContent=x.sourceLabel;officialBadgeEl.textContent=x.officialBadge;gpsTitle.textContent=x.gpsTitle;gpsSub.textContent=x.gpsSub;dataTitle.textContent=x.dataTitle;dataSub.textContent=x.dataSub;currentFlag.innerHTML=FLAGS[currentLang];document.querySelectorAll(".lang-option").forEach(o=>{o.classList.toggle("active",o.dataset.lang===currentLang);o.innerHTML=FLAGS[o.dataset.lang]});if(resultEl.dataset.features)renderStoredResult()}
function closeLang(){langWrap.classList.remove("open");langTrigger.setAttribute("aria-expanded","false")}langTrigger.addEventListener("click",e=>{e.stopPropagation();const open=langWrap.classList.toggle("open");langTrigger.setAttribute("aria-expanded",String(open))});document.querySelectorAll(".lang-option").forEach(o=>o.addEventListener("click",()=>{applyLanguage(o.dataset.lang);closeLang()}));document.addEventListener("click",e=>{if(!langWrap.contains(e.target))closeLang()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLang()});
function setStatus(text,cls=""){statusEl.className="status "+cls;statusEl.style.display="block";statusEl.innerHTML=text}function pointInRing(point,ring){const[x,y]=point;let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];const intersect=((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||Number.EPSILON)+xi);if(intersect)inside=!inside}return inside}function pointInPolygon(point,coords){if(!coords?.length||!pointInRing(point,coords[0]))return false;for(let i=1;i<coords.length;i++)if(pointInRing(point,coords[i]))return false;return true}function contains(feature,point){const g=feature.geometry;if(!g)return false;if(g.type==="Polygon")return pointInPolygon(point,g.coordinates);if(g.type==="MultiPolygon")return g.coordinates.some(poly=>pointInPolygon(point,poly));return false}function esc(v){return String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function zoneCard(f,lat,lon){const p=f.properties||{},x=t();return `<div class="zone-card"><div class="zone-label">${x.yourZone}</div><div class="zone">${esc(p.bwp_code)}</div><div class="zone-name">${esc(p.bwp_name)}</div></div><div class="details"><div class="row"><div class="label">${x.parkingRule}</div><div class="value">${esc(p.bewirtschaftungsart)}</div></div><div class="row"><div class="label">${x.hours}</div><div class="value">${esc(p.bewirtschaftungszeit)}</div></div><div class="row"><div class="label">${x.maxDuration}</div><div class="value">${p.hoechstparkdauer?esc(p.hoechstparkdauer)+" "+x.minutes:"—"}</div></div><div class="row"><div class="label">${x.feeZone}</div><div class="value">${esc(p.gebuehrenzone)}</div></div><div class="row"><div class="label">GPS</div><div class="value">${lat.toFixed(6)}, ${lon.toFixed(6)}</div></div></div>`}function renderStoredResult(){try{const data=JSON.parse(resultEl.dataset.features),x=t();if(data.matches.length===0){setStatus(x.outside,"warn");resultEl.innerHTML=`<div class="details"><div class="row"><div class="label">GPS</div><div class="value">${data.lat.toFixed(6)}, ${data.lon.toFixed(6)}</div></div></div>`}else{setStatus(data.matches.length>1?x.multiple(data.matches.length):x.found,"ok");resultEl.innerHTML=data.matches.map(f=>zoneCard(f,data.lat,data.lon)).join("")}}catch(_){}}
